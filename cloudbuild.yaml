# BUILD ONLY. The deploy step is deliberately absent: promotion to live needs Raivis' explicit
# per-time OK, and the sender repo learned that a deploy step in cloudbuild breaks silently.
# Deploy with:
#   gcloud run jobs update tiktik-brevo-snapshot --image <IMAGE> --region europe-west1
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t",
           "europe-west1-docker.pkg.dev/$PROJECT_ID/tiktik/tiktik-brevo-snapshot:$COMMIT_SHA", "."]
images:
  - "europe-west1-docker.pkg.dev/$PROJECT_ID/tiktik/tiktik-brevo-snapshot:$COMMIT_SHA"
options:
  logging: CLOUD_LOGGING_ONLY
